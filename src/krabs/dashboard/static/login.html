<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e13">
  <meta name="color-scheme" content="dark">
  <title>Krabs · locked</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-logo" aria-hidden="true">K</div>
    <h1>Krabs</h1>
    <p class="muted">Enter the dashboard token from <span class="mono">var/dashboard.token</span>.</p>
    {{ERROR}}
    <form method="post" action="/login" autocomplete="off">
      <label for="token">Dashboard token</label>
      <input id="token" name="token" type="password" autocomplete="current-password"
             autofocus required spellcheck="false">
      <button type="submit" class="primary">Unlock</button>
    </form>
    <p class="fineprint muted">
      The token is generated on first run. On a Pi it lives next to the audit
      database, readable only by the <span class="mono">krabs</span> user.
    </p>
  </main>
</body>
</html>
