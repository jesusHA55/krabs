# Daily-bar sample configuration.
# Data: data/samples/*.csv (generated by scripts/fetch_sample_data.py).
#
#   ./krabs backtest -c configs/sample-daily.toml
#   ./krabs backtest -c configs/sample-daily.toml --csv data/samples/energy.csv
#   ./krabs backtest -c configs/sample-daily.toml --csv data/samples/energy.csv \
#       --strategy buy_hold --param allocation=0.3
#
# `--csv` overrides csv_path and auto-detects the symbols in the file; use
# --symbols to narrow the universe and --timeframe to override the bar size.

[app]
name = "krabs"
mode = "backtest"
data_dir = "var"
log_level = "INFO"
log_json = false

[market]
symbols = ["AAPL", "MSFT", "NVDA"]
timeframe = "1Day"
history_days = 5
enforce_market_hours = true

[wallet]
starting_cash = 100000.0
currency = "USD"
allow_short = false
margin_multiplier = 1.0
fractional = true

[execution]
slippage_bps = 2.0          # daily bars: assume you pay the spread
half_spread_bps = 2.0
commission_per_share = 0.0  # Alpaca equities are commission-free
min_commission = 0.0
max_participation = 0.0     # daily volume is huge; no partial fills in this sample
allow_partial_fills = true

[risk]
max_order_notional = 100000.0
max_position_pct = 0.25
max_gross_exposure_pct = 0.80
max_daily_loss_pct = 0.10   # daily bars move more than intraday ones
max_open_orders = 10
max_data_age_s = 0          # backtests have no live feed to go stale
price_collar_pct = 0.10
duplicate_window_s = 0
allowed_symbols = []

[broker]
provider = "alpaca"
paper = true
api_key_env = "ALPACA_API_KEY"
api_secret_env = "ALPACA_SECRET_KEY"

[feed]
provider = "csv"
csv_path = "data/samples/information_technology.csv"
poll_seconds = 5.0
warmup_bars = 300

[storage]
enabled = false
path = "var/krabs.db"

[backtest]
report_dir = "reports"

[strategy]
name = "sma_cross"
params = { fast = 20, slow = 60, allocation = 0.20 }
