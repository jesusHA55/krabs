# 200-day SMA trend filter on leveraged index ETFs.
# Default: SPY signal, UPRO (3x S&P) risk-on, BIL defensive.
# Data: python3 scripts/fetch_sample_data.py --only leveraged_trend --start 2010-01-01
#
#   ./krabs backtest -c configs/leveraged-trend.toml

[app]
name = "krabs"
mode = "backtest"
data_dir = "var"
log_level = "INFO"
log_json = false

[market]
symbols = ["SPY", "QQQ", "SSO", "UPRO", "QLD", "TQQQ", "BIL"]
timeframe = "1Day"
history_days = 500
enforce_market_hours = true

[wallet]
starting_cash = 100000.0
currency = "USD"
allow_short = false
margin_multiplier = 1.0
fractional = true

[execution]
slippage_bps = 1.0
half_spread_bps = 1.0
commission_per_share = 0.0
min_commission = 0.0
max_participation = 0.0
impact_coefficient_bps = 0.0
allow_partial_fills = true

[execution.spread_bps]
SPY = 1.0
QQQ = 1.0
SSO = 2.0
UPRO = 3.0
QLD = 2.0
TQQQ = 3.0
BIL = 1.0

[risk]
max_order_notional = 10000000.0
max_position_pct = 1.0
max_gross_exposure_pct = 1.0
max_daily_loss_pct = 0.35
max_open_orders = 10
max_data_age_s = 0
price_collar_pct = 0.10
duplicate_window_s = 0
allowed_symbols = []

[broker]
provider = "paper"
paper = true

[feed]
provider = "csv"
csv_path = "data/samples/leveraged_trend.csv"
poll_seconds = 5.0
warmup_bars = 250

[storage]
enabled = false
path = "var/krabs.db"

[backtest]
report_dir = "reports"

[strategy]
name = "leveraged_trend"

[strategy.params]
signal_symbol = "SPY"
trade_symbol = "UPRO"
defensive_symbol = "BIL"
sma_days = 200
allocation = 0.97
