# ETF pairs trading: Johansen screening + Kalman z-score entry.
# Requires the generated ETF sample: python3 scripts/fetch_sample_data.py
#
#   ./krabs backtest -c configs/etf-pairs.toml

[app]
name = "krabs"
mode = "backtest"
data_dir = "var"
log_level = "INFO"
log_json = false

[market]
symbols = ["GDX", "IAI", "IGV", "IHI", "ITA", "IYR", "KBE", "KRE", "OIH", "SMH", "VGT", "VNQ", "VPU", "XAR", "XBI", "XES", "XLB", "XLC", "XLE", "XLF", "XLI", "XLK", "XLP", "XLRE", "XLU", "XLV", "XLY", "XME", "XOP", "XPH", "XRT", "XTL"]
timeframe = "1Day"
history_days = 5
enforce_market_hours = true

[wallet]
starting_cash = 100000.0
currency = "USD"
allow_short = true
margin_multiplier = 1.0
fractional = true

[execution]
slippage_bps = 1.0
half_spread_bps = 1.0
spreads_csv = "data/samples/etf_spreads.csv"
commission_per_share = 0.0
min_commission = 0.0
max_participation = 0.0
allow_partial_fills = true

[risk]
max_order_notional = 100000.0
max_position_pct = 0.20
max_gross_exposure_pct = 0.65
max_daily_loss_pct = 0.05
max_open_orders = 20
max_data_age_s = 0
price_collar_pct = 0.10
duplicate_window_s = 0
allowed_symbols = []

[broker]
provider = "paper"
paper = true

[feed]
provider = "csv"
csv_path = "data/samples/etf_sectors.csv"
poll_seconds = 5.0
warmup_bars = 300

[storage]
enabled = false
path = "var/krabs.db"

[backtest]
report_dir = "reports"

[strategy]
name = "etf_pairs"

[strategy.params]
model = "ou"
formation_days = 252
rescreen_days = 21
min_half_life = 2.0
max_half_life = 15.0
min_crossings_per_year = 12.0
periods_per_year = 252.0
max_bid_ask_bps = 5.0
default_spread_bps = 2.0
spreads_csv = "data/samples/etf_spreads.csv"
entry_z = 2.0
friction_multiple = 2.5
exit_z = 0.0
allocation = 0.10
max_pairs = 5
min_abs_beta = 0.20
max_abs_beta = 5.0
ou_window = 120
ou_refit = 20
ou_obs_ratio = 0.5
ou_warmup = 5
kf_level_var = 0.000001
kf_obs_var = 0.0001
kf_warmup = 20
driver = "XLK"

[strategy.params.clusters]
technology = ["XLK", "SMH", "IGV", "VGT"]
financials = ["XLF", "KBE", "KRE", "IAI"]
health_care = ["XLV", "XBI", "IHI", "XPH"]
energy = ["XLE", "XOP", "OIH", "XES"]
consumer = ["XLY", "XRT", "XLP"]
industrials = ["XLI", "XAR", "ITA"]
materials = ["XLB", "XME", "GDX"]
utilities = ["XLU", "VPU"]
real_estate = ["XLRE", "IYR", "VNQ"]
communication = ["XLC", "XTL"]
